# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
      - run: make lint
      - run: make fmt-check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
      - run: make typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
      - name: Set DB URL
        run: |
          if [ "${{ matrix.db }}" = "postgres" ]; then
            echo "DATABASE_URL=postgresql+asyncpg://test:test@localhost:5432/test" >> "$GITHUB_ENV"
          else
            echo "DATABASE_URL=sqlite+aiosqlite:///test.db" >> "$GITHUB_ENV"
          fi
      - run: make test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.db }}
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test
      - migrate-dry-run
    steps:
      - uses: actions/checkout@v6
      - run: make image-build
      - run: make image-scan || true

  migrate-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
      - name: Alembic SQL render (offline dry-run)
        run: |
          export DATABASE_URL="sqlite+aiosqlite:///./migration_ci.db"
          export JWT_SECRET_KEY="test-only-key-for-ci-migrations"
          export PYTHONPATH=.
          set -euo pipefail
          SQL_PREVIEW="$(mktemp)"
          (cd apps/api && python3 -m alembic upgrade head --sql) >"$SQL_PREVIEW" 2>&1
          head -n 50 "$SQL_PREVIEW"
          rm -f "$SQL_PREVIEW"
      - name: Alembic apply to ephemeral SQLite
        run: |
          export DATABASE_URL="sqlite+aiosqlite:///./migration_ci_apply.db"
          export JWT_SECRET_KEY="test-only-key-for-ci-migrations"
          export PYTHONPATH=.
          make migrate

  k8s-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
      - run: make k8s-validate

  queue-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
      - run: make queue-validate

  audit-self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
      - run: make audit-self
