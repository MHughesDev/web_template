# .github/workflows/security.yml
name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch: {}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Requires Dependency graph (repo Settings → Code security). Do not block CI if disabled.
      - uses: actions/dependency-review-action@v4
        continue-on-error: true

  code-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python
      - run: make security-scan

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make image-build
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: template-api:local
          version: v0.69.3
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivy-config: trivy.yaml
          trivyignores: .trivyignore

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required — gitleaks needs full git history to scan past commits.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hadolint/hadolint-action@v3.5.0
        # Advisory first, promote to blocking once initial findings are triaged
        # (mirrors the dependency-review "don't block CI if disabled" posture).
        continue-on-error: true
        with:
          dockerfile: apps/api/Dockerfile
          config: .hadolint.yaml
